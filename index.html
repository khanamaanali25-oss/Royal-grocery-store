<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Royal Grocery Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.container{
width:450px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0px 20px 50px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:30px;
font-weight:700;
color:#2E7D32;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:gray;
margin-bottom:25px;
}

.input{
width:100%;
padding:14px;
margin-top:12px;
border:none;
background:#f4f4f4;
border-radius:12px;
font-size:15px;
transition:.3s;
}

.input:focus{
background:white;
outline:none;
border:2px solid #2E7D32;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#2E7D32;
color:white;
font-size:18px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1B5E20;
}

#msg{
text-align:center;
margin-top:20px;
font-weight:600;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">👑 Royal Grocery Store</div>

<div class="subtitle">Customer Registration Form</div>

<form id="myForm">

<input class="input" type="text" id="name" placeholder="Full Name" required>

<input class="input" type="tel" id="mobile" placeholder="Mobile Number" required>

<input class="input" type="email" id="email" placeholder="Email">

<textarea class="input" id="address" placeholder="Address"></textarea>

<input class="input" type="text" id="city" placeholder="City">

<input class="input" type="number" id="pin" placeholder="PIN Code">

<button type="submit" id="btn">Save Customer</button>

</form>

<div id="msg"></div>

</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbx9PSatdSnQ-lMD8NoIWleSbaan6-3nWMvbYm5-DyH4h4w4Iubp-QJkTAUHxAaFX2d9/exec";

const form = document.getElementById("myForm");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");

form.addEventListener("submit", function(e){

e.preventDefault();

btn.disabled = true;
btn.innerText = "Saving...";

fetch(scriptURL, {
method: "POST",
body: JSON.stringify({
name: document.getElementById("name").value,
mobile: document.getElementById("mobile").value,
email: document.getElementById("email").value,
address: document.getElementById("address").value,
city: document.getElementById("city").value,
pin: document.getElementById("pin").value
})
})

.then(res => res.json())
.then(data => {

msg.innerText = "Your info is saved successfully ✅";
msg.style.color = "green";

// reset form for next customer
form.reset();

// focus first input
document.getElementById("name").focus();

// reset button
btn.disabled = false;
btn.innerText = "Save Customer";

// hide message after 3 sec
setTimeout(() => {
msg.innerText = "";
}, 3000);

})

.catch(err => {

msg.innerText = "Error saving data ❌";
msg.style.color = "red";

btn.disabled = false;
btn.innerText = "Save Customer";

});

});

</script>

</body>
</html>
