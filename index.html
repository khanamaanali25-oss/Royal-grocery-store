<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Grocery Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    color:green;
    margin-bottom:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    padding:10px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin-top:10px;
    color:white;
}

.save{
    background:green;
}

.delete{
    background:red;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th,table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:rgb(26, 0, 128);
    color:white;
}
</style>

</head>
<body>

<div class="container">

<h1>ROYAL GROCERY STORE</h1>

<input type="number" id="number" placeholder="Customer Number">

<input type="text" id="name" placeholder="Customer Name">

<input type="text" id="product" placeholder="Product Name">

<input type="number" id="qty" placeholder="Quantity">

<input type="number" id="price" placeholder="Price">

<select id="delivery">
<option>Yes</option>
<option>No</option>
</select>

<button class="save" onclick="saveData()">Save Order</button>

<table>

<thead>
<tr>
<th>Customer No</th>
<th>Name</th>
<th>Product</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Delivery</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="tableData"></tbody>

</table>

</div>

<script>

let orders = JSON.parse(localStorage.getItem("orders")) || [];

showData();

function saveData(){

let number=document.getElementById("number").value;
let name=document.getElementById("name").value;
let product=document.getElementById("product").value;
let qty=document.getElementById("qty").value;
let price=document.getElementById("price").value;
let delivery=document.getElementById("delivery").value;

if(number=="" || name=="" || product==""){
    alert("Please fill all fields");
    return;
}

let total=qty*price;

orders.push({
number,
name,
product,
qty,
price,
total,
delivery
});

localStorage.setItem("orders",JSON.stringify(orders));

showData();

document.getElementById("number").value="";
document.getElementById("name").value="";
document.getElementById("product").value="";
document.getElementById("qty").value="";
document.getElementById("price").value="";
}

function showData(){

let table="";

orders.forEach((item,index)=>{

table+=`
<tr>
<td>${item.number}</td>
<td>${item.name}</td>
<td>${item.product}</td>
<td>${item.qty}</td>
<td>₹${item.price}</td>
<td>₹${item.total}</td>
<td>${item.delivery}</td>
<td><button class="delete" onclick="deleteData(${index})">Delete</button></td>
</tr>
`;

});

document.getElementById("tableData").innerHTML=table;

}

function deleteData(index){

orders.splice(index,1);

localStorage.setItem("orders",JSON.stringify(orders));

showData();

}

</script>

</body>
</html>
